name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install FontTools conformance oracle
        run: python -m pip install "fonttools[woff]==4.63.0"

      - name: Install dependencies
        run: npm ci

      - name: Test release contract
        run: npm run test:release

      - name: Verify release archive
        run: npm run release

      - name: Verify committed native binaries
        run: git diff --exit-code -- binaries

      - name: Verify
        env:
          MOJI_FONTTOOLS_CONFORMANCE: "1"
        run: npm run verify

  homebrew-release:
    name: Homebrew release (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Prepare published 0.8.1 formula candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Formula/moji.rb")
          content = path.read_text()
          old_url = "https://registry.npmjs.org/@microck/moji/-/moji-0.7.0.tgz"
          old_sha = "2430859658fc26fe4da37bff6b27b0900dc28b9f6c92c16ebf26f083a2939afb"
          assert content.count(old_url) == 1 and content.count(old_sha) == 1
          path.write_text(content.replace(old_url, "https://registry.npmjs.org/@microck/moji/-/moji-0.8.1.tgz").replace(old_sha, "cfee5c54106b2fa0332f3dd5ddb556a1a010dd5f6e402ea1f60a56d56e40ff44"))
          PY
          git diff --check
          git diff -- Formula/moji.rb
      - name: Install and test published formula
        shell: bash
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          brew tap-new --no-git microck/release-validation
          tap_dir="$(brew --repository microck/release-validation)"
          cp Formula/moji.rb "$tap_dir/Formula/moji.rb"
          cmp Formula/moji.rb "$tap_dir/Formula/moji.rb"
          brew install --build-from-source microck/release-validation/moji
          brew test microck/release-validation/moji
          test "$(moji --version)" = "0.8.1"
